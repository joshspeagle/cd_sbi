defaults:
  - target: loc_normal_1d
  - flow: additive_umnn
  - conditioner: identity
  - method: cd_sbi
  - training: adamw_cosine_warmup
  - budget: medium
  - experiment: 8_1_replication
  - _self_

device: auto
seed: 0

# subdir includes the target plus training-config axes (n_train, fresh_batch,
# training name) and the budget/method/seed axes so multiruns sweeping any of
# them don't collide. (Pilot B 2026-06-10: a raw-vs-asinh target sweep silently
# clobbered same-method runs into one dir before target= was added.)
run_dir: outputs/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}/target=${target.name},method=${method.name},budget=${budget.name},train=${training.name},ntrain=${training.n_train},fresh=${training.fresh_batch},seed=${seed}

hydra:
  run:
    dir: ${run_dir}
  sweep:
    dir: outputs/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: target=${target.name},method=${method.name},budget=${budget.name},train=${training.name},ntrain=${training.n_train},fresh=${training.fresh_batch},seed=${seed}
