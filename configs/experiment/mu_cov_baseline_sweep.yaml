# @package _global_
# (μ,Σ) d=5 cross-method-ish sweep: CD-SBI vs Score-CD across budgets (model size).
# NO `method.flow` block (so Score-CD's flow=maf is not overridden). CD-SBI runs need
# `method.flow=single_index_monotone` on the CLI; Score-CD uses the NLE-shaped MAF
# (slow path) and ignores the bartlett_summary conditioner (NLE models raw X∈ℝ²⁰).
# Training block mirrors mu_cov_replication (d=5 needs more steps than the §8.x default).
defaults:
  - override /target: normal_mu_cov
  - override /flow: single_index_monotone
  - override /conditioner: bartlett_summary
  - override /method: cd_sbi
  - override /budget: medium

training:
  lr: 3e-3
  n_steps: 12000
  batch_size: 256
  n_train: 20000
  optimizer: adamw
  fresh_batch: false

experiment:
  name: mu_cov_baseline_sweep
  n_eval: 6000
  eval_thetas_interior:
    - [0.271, 0.084, 0.180, -2.631, -1.055]
    - [-0.219, 0.274, 0.801, -1.329, 1.149]
    - [-0.093, -0.344, -1.098, -0.763, 2.726]
    - [0.094, 0.588, -1.227, -0.487, 2.091]
    - [0.455, 0.788, 1.374, 0.507, -1.731]
    - [-0.502, 0.115, 0.941, -0.257, 0.506]
    - [-0.422, -0.846, 1.287, 2.354, -1.322]
    - [0.194, -0.743, 0.396, -2.600, 0.991]
    - [-0.295, 0.421, -0.111, -2.002, -2.772]
    - [-0.904, 0.890, -1.429, 1.843, -0.687]
    - [0.826, 0.545, -0.914, -1.522, 0.249]
    - [0.555, -0.052, 0.226, 1.039, -2.270]
    - [0.755, -0.595, -0.205, 2.032, 1.763]
    - [-0.650, -0.252, -0.552, 2.863, -0.040]
    - [-0.759, -0.221, 0.667, 0.017, -2.062]
    - [0.639, -0.529, -0.749, 1.144, 2.452]
  eval_thetas_edge: []
  alpha_grid: [0.5, 0.68, 0.9, 0.95]
  n_eval_per_theta: 2000
  joint_mahalanobis_n_per_theta: 2000
