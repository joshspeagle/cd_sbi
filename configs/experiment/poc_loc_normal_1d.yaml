# @package _global_
# LF2I-Score POC, regular arm 1: 1D location-normal (score = Wald sanity).
# Upgraded eval (hardening item 6): 9-pt interior + LIVE prior-edge points,
# n_per_theta=5000; oracle r_star floor row recorded automatically.
defaults:
  - override /target: loc_normal_1d

experiment:
  name: poc_loc_normal_1d
  n_eval: 5000
  eval_thetas_interior: [-6.0, -4.5, -3.0, -1.5, 0.0, 1.5, 3.0, 4.5, 6.0]
  eval_thetas_edge: [-7.0, 7.0]
  alpha_grid: [0.5, 0.68, 0.9, 0.95]
  n_eval_per_theta: 5000

hydra:
  mode: MULTIRUN
  sweeper:
    params:
      method: cd_sbi,nle,score_cd_rao,score_cd_cal,lf2i_bff
      budget: small,medium,large,xlarge
      seed: 0,1,2,3,4
      # Both regimes (hardening item 8): the fixed-set regime is the
      # research-realistic default; fresh-batch isolates the score's
      # overfitting-amplification. BOTH are reported.
      training.fresh_batch: false,true
